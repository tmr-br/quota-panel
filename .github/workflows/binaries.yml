name: Build binaries

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # macOS 26 requires LC_UUID, emitted by default since Go 1.24.
          go-version: stable

      - name: Test
        run: go test -count=1 ./...

      - name: Package Linux and macOS binaries
        shell: bash
        run: |
          stage="$(mktemp -d)"
          mkdir -p "$stage/assets" "$stage/docs" dist
          cp LICENSE THIRD_PARTY.txt README.md trofeo.toml "$stage/"
          cp assets/OFL.txt assets/IBMPlexSans-OFL.txt "$stage/assets/"
          cp docs/panel-demo.png "$stage/docs/"
          for os in linux darwin; do
            for arch in amd64 arm64; do
              GOOS="$os" GOARCH="$arch" go build -trimpath -o "$stage/trofeo-quota" .
              tar -czf "dist/quota-panel-$os-$arch.tar.gz" -C "$stage" .
            done
          done
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload binaries and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quota-panel-binaries
          path: dist/
          if-no-files-found: error
          compression-level: 0

  verify-package:
    name: Run packaged binary (${{ matrix.target }})
    needs: build
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quota-panel-binaries
          path: dist

      - name: Verify checksums and run the native executable
        working-directory: dist
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          shasum -a 256 -c SHA256SUMS
          mkdir extracted
          tar -xzf "quota-panel-$TARGET.tar.gz" -C extracted
          cd extracted
          ./trofeo-quota -version
          ./trofeo-quota -config trofeo.toml -check-config
          ./trofeo-quota -demo -status json > "$RUNNER_TEMP/status.json"
          ./trofeo-quota -demo -preview-size 1920x462 -preview "$RUNNER_TEMP/panel.png"
          python3 - "$RUNNER_TEMP" <<'PY'
          import json
          import struct
          import sys
          from pathlib import Path

          folder = Path(sys.argv[1])
          status = json.loads((folder / "status.json").read_text())
          assert status["demo"] and len(status["groups"]) == 4
          png = (folder / "panel.png").read_bytes()
          assert png[:8] == bytes.fromhex("89504e470d0a1a0a")
          assert struct.unpack(">II", png[16:24]) == (1920, 462)
          PY
